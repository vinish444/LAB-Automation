version: "3.8"

services:

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    cap_add:
      - IPC_LOCK

  vault-agent:
    build:
      context: .
      dockerfile: vault-agent/Dockerfile
    environment:
      ROLE_ID: ${ROLE_ID}
      WRAP_TOKEN: ${WRAP_TOKEN}
      VAULT_ADDR: http://vault:8200   # 🔥 FIX
    volumes:
      - ./vault-agent:/vault-agent
      - secrets:/vault/secrets
    command: ["sh", "/vault-agent/entrypoint.sh"]
    depends_on:
      - vault

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      - vault-agent
    volumes:
      - secrets:/vault/secrets

volumes:
  secrets: