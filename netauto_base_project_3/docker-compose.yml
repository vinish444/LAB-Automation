services:
  redis:
    image: redis:7-alpine
    container_name: netauto-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: netauto-api
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["/app/docker/api-start.sh"]
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: netauto-worker
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["/app/docker/celery-start.sh"]
