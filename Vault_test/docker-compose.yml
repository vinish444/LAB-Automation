version: "3.8"

services:

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev

  vault-agent:
    image: hashicorp/vault:1.15
    container_name: vault-agent
    depends_on:
      - vault
    volumes:
      - ./agent/vault-agent.hcl:/vault/config.hcl
      - ./agent/template.ctmpl:/vault/template/template.ctmpl
      - ./bootstrap:/vault/bootstrap
      - shared:/vault
    command: vault agent -config=/vault/config.hcl

  app:
    build: ./app
    container_name: app
    depends_on:
      - vault-agent
    volumes:
      - shared:/vault

volumes:
  shared:
